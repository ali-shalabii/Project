<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بصمة | BASMA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Cairo,Inter,sans-serif;background:#294C36;color:#1f2e24;min-height:100vh;display:grid;place-items:center;padding:20px}
html[lang=en] body{font-family:Inter,Cairo,sans-serif}
.box{background:#F4F0E5;border-top:6px solid #A9C77B;border-radius:16px;padding:28px;width:100%;max-width:400px}
h1{color:#294C36;margin:0}.sub{color:#657A46;margin:0 0 18px;font-weight:600}
label{display:grid;gap:4px;font-weight:600;color:#294C36;margin-bottom:12px}
input{font:inherit;padding:10px 12px;border:2px solid #A9C77B;border-radius:10px;background:#fff}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;width:100%}
.p{background:#294C36;color:#F4F0E5}.g{background:#A9C77B;color:#294C36;margin-top:10px}
.l{background:transparent;color:#294C36;width:auto;padding:4px 10px;border:1px solid #657A46;float:inline-end}
#msg{margin-top:14px;padding:10px 12px;border-radius:10px;display:none}#msg.err{display:block;background:#f6d9cf}
a{color:#657A46}:focus-visible{outline:3px solid #96734B;outline-offset:2px}
</style>
</head>
<body>
<div class="box">
  <button class="l" id="lb" type="button">EN</button>
  <h1>🌿 <span id="t0"></span></h1><p class="sub" id="t1"></p>
  <form id="f">
    <label><span id="t2"></span><input id="email" type="email" required autocomplete="username"></label>
    <label><span id="t3"></span><input id="pw" type="password" required autocomplete="current-password"></label>
    <button class="p" type="submit" id="t4"></button>
  </form>
  <button class="g" id="guest" type="button"></button>
  <div id="msg" role="status"></div>
  <p><a href="welcome.html" id="t6"></a></p>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
let lang=localStorage.getItem("basma_lang")||"ar";
const T={ar:["بصمة","اكتشف الطبيعة، تعلّم، واترك بصمتك.","البريد الإلكتروني","كلمة المرور","دخول","","تعرّف على بصمة وخدمات المدارس","الدخول كزائر (بدون حساب)","البريد أو كلمة المرور غير صحيحة.","الحساب غير مفعّل. تواصل مع المدرسة أو المنصة.","تسجيل الدخول غير متصل بقاعدة البيانات بعد. يمكنك الدخول كزائر."],
en:["BASMA","Discover Nature. Learn. Make a Difference.","Email","Password","Log in","","About BASMA and school plans","Continue as guest (no account)","Wrong email or password.","Account is not active. Contact your school or the platform.","Login is not connected to the database yet. You can continue as a guest."]};
const $=i=>document.getElementById(i);
function paint(){const x=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 ["t0","t1","t2","t3","t4","t6"].forEach((k,i)=>$(k).textContent=x[[0,1,2,3,4,6][i]]);$("guest").textContent=x[7];$("lb").textContent=lang==="ar"?"EN":"عربي";}
$("lb").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("basma_lang",lang);paint()};
const m=(k)=>{$("msg").className="err";$("msg").textContent=T[lang][k]};
$("guest").onclick=()=>{sessionStorage.setItem("basma_guest","1");location.href="app.html"};
const U=window.BASMA||{};
if(!U.url||!U.key){$("f").querySelector("button").disabled=true;m(10)}
else{const sb=supabase.createClient(U.url,U.key);
 sb.auth.getSession().then(({data})=>{if(data.session)location.href="app.html"});
 $("f").onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("pw").value});
  if(error){m(8);return}location.href="app.html"};}
paint();
</script>
</body>
</html>
