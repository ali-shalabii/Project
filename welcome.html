<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بصمة | BASMA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--olive:#657A46;--forest:#294C36;--light:#A9C77B;--beige:#F4F0E5;--white:#fff;--earth:#96734B;--ink:#1f2e24}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Cairo,Inter,system-ui,sans-serif;background:var(--beige);color:var(--ink);line-height:1.7}
html[lang=en] body{font-family:Inter,Cairo,system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:var(--forest);color:var(--beige)}
header .wrap{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.4rem;text-decoration:none;margin-inline-end:auto}
nav{display:flex;gap:16px;font-size:.95rem;flex-wrap:wrap}
nav a{text-decoration:none;opacity:.9}nav a:hover{opacity:1;text-decoration:underline}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font-weight:600;text-decoration:none;display:inline-block}
.btn-p{background:var(--light);color:var(--forest)}
.btn-o{background:transparent;color:inherit;border:2px solid currentColor}
.lang{background:transparent;color:var(--beige);border:1px solid var(--light);padding:6px 12px}
:focus-visible{outline:3px solid var(--earth);outline-offset:2px}
.hero{background:var(--forest);color:var(--beige);position:relative;overflow:hidden;padding:72px 0 96px}
.hero svg{position:absolute;inset-inline-end:-40px;bottom:-30px;width:min(520px,70%);opacity:.35}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.25;max-width:14em;font-weight:800}
.hero p{max-width:34em;margin:18px 0 28px;font-size:1.1rem;opacity:.92}
.hero .tag{color:var(--light);font-weight:600;margin-bottom:10px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
section{padding:64px 0}
section.alt{background:var(--white)}
h2{font-size:1.9rem;color:var(--forest);margin-bottom:8px;font-weight:800}
.lead{max-width:40em;margin-bottom:28px;color:#41524a}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.step{border-inline-start:5px solid var(--olive);padding:4px 16px}
.step b{display:block;color:var(--forest);font-size:1.1rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filters button{background:var(--beige);color:var(--forest);border:2px solid var(--olive)}
.filters button[aria-pressed=true]{background:var(--olive);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--beige);border-radius:16px;padding:20px;border-top:6px solid var(--light)}
.card h3{color:var(--forest);font-size:1.2rem}
.card .sci{font-style:italic;color:var(--earth);font-family:Inter,sans-serif;font-size:.9rem}
.card .en{font-family:Inter,sans-serif;font-size:.9rem;color:#5b6b60}
.card p{margin:10px 0;font-size:.95rem}
.badge{display:inline-block;background:#f6e3c4;color:#6b4a14;border-radius:8px;padding:2px 10px;font-size:.8rem;font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
ul.check{list-style:none;padding:0}
ul.check li{padding-inline-start:28px;position:relative;margin:8px 0}
ul.check li::before{content:"✓";position:absolute;inset-inline-start:0;color:var(--olive);font-weight:800}
.plan{background:var(--white);border:2px solid var(--light);border-radius:16px;padding:22px}
.plan.hl{border-color:var(--forest)}
.price{font-size:2rem;font-weight:800;color:var(--forest);font-family:Inter,sans-serif}
.note{font-size:.85rem;color:#5b6b60;margin-top:14px}
form{display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:600;color:var(--forest)}
input,textarea{font:inherit;padding:10px 12px;border:2px solid var(--light);border-radius:10px;background:var(--beige)}
#msg{padding:12px 14px;border-radius:10px;display:none}
#msg.ok{display:block;background:#dcebc6}#msg.err{display:block;background:#f6d9cf}
footer{background:var(--forest);color:var(--beige);padding:28px 0;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.hero svg{animation:sway 9s ease-in-out infinite alternate}}
@keyframes sway{to{transform:rotate(4deg)}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#top">🌿 <span data-i18n="brand"></span></a>
  <nav>
    <a href="#about" data-i18n="n_about"></a><a href="#library" data-i18n="n_lib"></a>
    <a href="#schools" data-i18n="n_sch"></a><a href="#plans" data-i18n="n_plans"></a><a href="#demo" data-i18n="n_contact"></a>
  </nav>
  <button class="lang" id="langBtn" type="button">EN</button>
</div></header>

<main id="top">
<div class="hero"><div class="wrap">
  <svg viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="#A9C77B" stroke-width="2">
    <path d="M100 190V60"/><path d="M100 150c-40-5-60-30-60-60 40 5 60 30 60 60z"/><path d="M100 120c35-5 55-28 55-55-35 4-55 27-55 55z"/><path d="M100 80c-25-3-38-20-38-40 25 3 38 20 38 40z"/>
  </svg>
  <div class="tag" data-i18n="tag"></div>
  <h1 data-i18n="h1"></h1>
  <p data-i18n="h1p"></p>
  <div class="cta">
    <a class="btn btn-p" href="#library" data-i18n="b_disc"></a>
    <a class="btn btn-o" href="#schools" data-i18n="b_sch"></a>
    <a class="btn btn-o" href="index.html" data-i18n="b_login"></a>
  </div>
</div></div>

<section id="about"><div class="wrap">
  <h2 data-i18n="a_t"></h2><p class="lead" data-i18n="a_p"></p>
  <div class="steps">
    <div class="step"><b data-i18n="s1t"></b><span data-i18n="s1p"></span></div>
    <div class="step"><b data-i18n="s2t"></b><span data-i18n="s2p"></span></div>
    <div class="step"><b data-i18n="s3t"></b><span data-i18n="s3p"></span></div>
    <div class="step"><b data-i18n="s4t"></b><span data-i18n="s4p"></span></div>
  </div>
</div></section>

<section id="library" class="alt"><div class="wrap">
  <h2 data-i18n="l_t"></h2><p class="lead" data-i18n="l_p"></p>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <p class="note" data-i18n="l_note"></p>
</div></section>

<section id="schools"><div class="wrap two">
  <div><h2 data-i18n="sc_t"></h2><p class="lead" data-i18n="sc_p"></p></div>
  <ul class="check">
    <li data-i18n="sc1"></li><li data-i18n="sc2"></li><li data-i18n="sc3"></li><li data-i18n="sc4"></li><li data-i18n="sc5"></li>
  </ul>
</div></section>

<section id="plans" class="alt"><div class="wrap">
  <h2 data-i18n="p_t"></h2><p class="lead" data-i18n="p_p"></p>
  <div class="grid">
    <div class="plan"><h3>Basic</h3><div class="price">$1,200</div><span data-i18n="p_yr"></span></div>
    <div class="plan hl"><h3>Advanced</h3><div class="price">$1,800</div><span data-i18n="p_yr"></span></div>
    <div class="plan"><h3>Premium</h3><div class="price">$2,500</div><span data-i18n="p_yr"></span></div>
  </div>
  <p class="note" data-i18n="p_note"></p>
</div></section>

<section id="demo"><div class="wrap" style="max-width:640px">
  <h2 data-i18n="d_t"></h2><p class="lead" data-i18n="d_p"></p>
  <form id="demoForm">
    <label><span data-i18n="f_school"></span><input name="school_name" required></label>
    <label><span data-i18n="f_gov"></span><input name="governorate" required></label>
    <label><span data-i18n="f_contact"></span><input name="contact_name" required></label>
    <label><span data-i18n="f_email"></span><input name="email" type="email" required></label>
    <label><span data-i18n="f_phone"></span><input name="phone" type="tel" required></label>
    <label><span data-i18n="f_msg"></span><textarea name="message" rows="3"></textarea></label>
    <button class="btn-p" type="submit" data-i18n="f_send"></button>
    <div id="msg" role="status"></div>
  </form>
</div></section>
</main>

<footer><div class="wrap" data-i18n="foot"></div></footer>

<script src="config.js"></script>
<script>
/* ===== إعداد قاعدة البيانات (Supabase) — املأ القيمتين بعد إنشاء المشروع ===== */
const SUPABASE_URL = (window.BASMA||{}).url||"";
const SUPABASE_ANON_KEY = (window.BASMA||{}).key||"";

const T = {
ar:{brand:"بصمة",n_about:"عن بصمة",n_lib:"المكتبة البيئية",n_sch:"للمدارس",n_plans:"الباقات",n_contact:"تواصل معنا",
tag:"اكتشف الطبيعة، تعلّم، واترك بصمتك.",h1:"رحلة طفلك لاكتشاف الطبيعة تبدأ من هنا.",
h1p:"بصمة منصة تعليمية تفاعلية تساعد الطلبة على اكتشاف التنوع الحيوي الفلسطيني من خلال القصص والألعاب والتحديات التعليمية.",
b_disc:"اكتشف بصمة",b_sch:"للمدارس",b_login:"تسجيل الدخول",
a_t:"عن بصمة",a_p:"منصة للصفوف الرابع والخامس والسادس الأساسي، تحوّل التعليم البيئي من معلومات نظرية إلى تجربة ممتعة مرتبطة بالبيئة الفلسطينية.",
s1t:"استكشف",s1p:"بطاقات الأنواع من نباتات وطيور وحشرات وحيوانات.",s2t:"اقرأ",s2p:"قصص قصيرة باختيارات تؤثر على النهاية.",
s3t:"العب",s3p:"ألعاب تعليمية بنقاط وتغذية راجعة فورية.",s4t:"تقدّم",s4p:"شارات ومستويات يتابعها الطالب والمعلم.",
l_t:"المكتبة البيئية",l_p:"عيّنة من بطاقات الكائنات الحية الفلسطينية.",all:"الكل",plant:"نباتات",bird:"طيور",insect:"حشرات",
review:"بحاجة إلى مراجعة علمية",src:"المصدر: لم يُضف بعد",
l_note:"هذه بطاقات تجريبية: الأسماء العلمية معروفة، لكن بقية المعلومات (أماكن الانتشار، حالة الحفظ، التهديدات) لم تُوثّق بعد وسيضيفها محررو المحتوى مع مصادرها.",
sc_t:"للمدارس الخاصة",sc_p:"بصمة اشتراك سنوي للمدرسة، مع لوحات متابعة للمعلم والإدارة.",
sc1:"لوحة معلم لمتابعة تقدم كل طالب",sc2:"واجبات وتحديات صفية",sc3:"تقارير أداء قابلة للتصدير",sc4:"خصوصية للأطفال وبلا إعلانات",sc5:"واجهة عربية كاملة مع إنجليزية",
p_t:"الباقات",p_p:"اشتراك سنوي للمدرسة.",p_yr:"في السنة",p_note:"الأسعار أولية وقابلة للتغيير، ورسوم التفعيل الأولية $250.",
d_t:"اطلب تجربة",d_p:"اترك بيانات مدرستك وسنتواصل معك.",
f_school:"اسم المدرسة",f_gov:"المحافظة",f_contact:"اسم المسؤول",f_email:"البريد الإلكتروني",f_phone:"رقم التواصل",f_msg:"رسالة (اختياري)",f_send:"أرسل الطلب",
ok:"تم استلام طلبك. شكرًا لك!",err:"تعذّر الإرسال. حاول مرة أخرى.",noDb:"نموذج الطلب غير متصل بقاعدة البيانات بعد، لذلك لم يُرسل شيء. اربط Supabase (انظر README).",
foot:"© بصمة | BASMA — منصة التعليم البيئي الفلسطيني. النسخة الأولى (المرحلة 1)."},
en:{brand:"BASMA",n_about:"About",n_lib:"Nature Library",n_sch:"For Schools",n_plans:"Plans",n_contact:"Contact",
tag:"Discover Nature. Learn. Make a Difference.",h1:"Your child's journey to discover nature starts here.",
h1p:"BASMA is an interactive learning platform that helps students discover Palestinian biodiversity through stories, games and challenges.",
b_disc:"Discover BASMA",b_sch:"For Schools",b_login:"Log in",
a_t:"About BASMA",a_p:"Built for grades 4–6, BASMA turns environmental education from theory into a fun experience rooted in Palestinian nature.",
s1t:"Explore",s1p:"Species cards for plants, birds, insects and animals.",s2t:"Read",s2p:"Short stories whose choices change the ending.",
s3t:"Play",s3p:"Learning games with points and instant feedback.",s4t:"Progress",s4p:"Badges and levels tracked by students and teachers.",
l_t:"Nature Library",l_p:"A sample of Palestinian species cards.",all:"All",plant:"Plants",bird:"Birds",insect:"Insects",
review:"Needs scientific review",src:"Source: not added yet",
l_note:"These are demo cards: scientific names are well known, but other details (distribution, conservation status, threats) are not yet documented. Content editors will add them with sources.",
sc_t:"For private schools",sc_p:"BASMA is an annual school subscription with teacher and admin dashboards.",
sc1:"Teacher dashboard to track each student",sc2:"Assignments and class challenges",sc3:"Exportable performance reports",sc4:"Child privacy, no ads",sc5:"Full Arabic interface with English",
p_t:"Plans",p_p:"Annual subscription per school.",p_yr:"per year",p_note:"Prices are initial and changeable. One-time activation fee: $250.",
d_t:"Request a demo",d_p:"Leave your school's details and we will contact you.",
f_school:"School name",f_gov:"Governorate",f_contact:"Contact person",f_email:"Email",f_phone:"Phone",f_msg:"Message (optional)",f_send:"Send request",
ok:"Request received. Thank you!",err:"Could not send. Please try again.",noDb:"The request form is not connected to a database yet, so nothing was sent. Connect Supabase (see README).",
foot:"© BASMA — Palestinian environmental education platform. First release (Phase 1)."}
};
const SPECIES=[
{t:"plant",ar:"السوسن الفقوعي",en:"Gilboa iris",sci:"Iris haynei",d:{ar:"زهرة سوسن برية مرتبطة باسم منطقة فقوعة (جلبوع).",en:"A wild iris associated with the Fuqu'a (Gilboa) area."}},
{t:"plant",ar:"شجرة الزيتون",en:"Olive tree",sci:"Olea europaea",d:{ar:"شجرة معمّرة معروفة في فلسطين وتُزرع لثمارها وزيتها.",en:"A long-lived tree widely grown in Palestine for its fruit and oil."}},
{t:"plant",ar:"الرقوق (السيكلامن)",en:"Persian cyclamen",sci:"Cyclamen persicum",d:{ar:"نبات بري مزهر يُعرف بأزهاره ذات البتلات المنعكسة.",en:"A wild flowering plant known for its swept-back petals."}},
{t:"bird",ar:"طائر الشمس الفلسطيني",en:"Palestine sunbird",sci:"Cinnyris osea",d:{ar:"طائر صغير يتغذى على رحيق الأزهار ويُعرف بطائر فلسطين الوطني.",en:"A small nectar-feeding bird, known as Palestine's national bird."}},
{t:"insect",ar:"نحلة العسل",en:"Western honey bee",sci:"Apis mellifera",d:{ar:"حشرة اجتماعية تلقّح الأزهار وتنتج العسل.",en:"A social insect that pollinates flowers and makes honey."}}
];
let lang="ar", filter="all";
const $=s=>document.querySelector(s);
function render(){
  const L=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=L[e.dataset.i18n]);
  $("#langBtn").textContent=lang==="ar"?"EN":"عربي";
  $("#filters").innerHTML=["all","plant","bird","insect"].map(k=>
    `<button type="button" data-k="${k}" aria-pressed="${k===filter}">${L[k]}</button>`).join("");
  $("#grid").innerHTML=SPECIES.filter(s=>filter==="all"||s.t===filter).map(s=>
    `<article class="card"><h3>${lang==="ar"?s.ar:s.en}</h3>
     <div class="en">${lang==="ar"?s.en:s.ar}</div><div class="sci">${s.sci}</div>
     <p>${s.d[lang]}</p><span class="badge">${L.review}</span><div class="note">${L.src}</div></article>`).join("");
  document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{filter=b.dataset.k;render()});
}
$("#langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";render()};
$("#demoForm").onsubmit=async e=>{
  e.preventDefault();
  const m=$("#msg"),L=T[lang];
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY){m.className="err";m.textContent=L.noDb;return}
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/school_leads",{method:"POST",
      headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,Prefer:"return=minimal"},
      body:JSON.stringify({...Object.fromEntries(new FormData(e.target)),status:"Lead",source:"landing_demo_form"})});
    if(!r.ok)throw 0;
    m.className="ok";m.textContent=L.ok;e.target.reset();
  }catch(_){m.className="err";m.textContent=L.err}
};
render();
</script>
</body>
</html>
